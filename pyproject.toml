[project]
name = "enzyme-searcher"
version = "0.2.0"
description = "Enzymes of bacterial genera from BacDive, KEGG and BRENDA in one clean format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bacdive>=2.0",
    "requests>=2.31",
    "pandas>=2.1",
    "xlsxwriter>=3.1",
]

[project.optional-dependencies]
brenda = ["zeep>=4.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "openpyxl>=3.1",
    "marimo>=0.25",
    "altair>=5.4",
    "zeep>=4.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enzyme_searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
